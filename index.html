<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="A private camera powered by user-authorized Files storage.">
  <title>Camera</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="https://lsong.org/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://lsong.org/stylesheets/dialog.css">
  <link rel="stylesheet" href="index.css?v=401195a">
  <script type="module" src="index.js?v=3d933c9"></script>
</head>
<body>
  <main class="camera-app">
    <header class="topbar">
      <a href="https://lsong.org" aria-label="Lsong home">Lsong</a>
      <strong>Camera</strong>
      <button id="account-button" class="text-button" type="button" hidden>Disconnect</button>
    </header>
    <section class="viewfinder" aria-label="Camera preview">
      <video id="preview" autoplay muted playsinline></video>
      <div id="camera-message" class="camera-message">Starting camera…</div>
      <button id="switch-camera" class="switch-camera" type="button" aria-label="Switch camera" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h3l1.2-2h1.6L14 7h3a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3Z"/><path d="M9 13a3 3 0 0 1 5.4-1.8M15 13a3 3 0 0 1-5.4 1.8"/><path d="m13.8 9.7.7 1.8 1.8-.7M10.2 16.3l-.7-1.8-1.8.7"/></svg>
      </button>
      <button id="shutter" class="shutter" type="button" aria-label="Take photo" disabled><span></span></button>
    </section>
    <section class="library" aria-labelledby="library-title">
      <div class="section-heading">
        <h1 id="library-title">Your photos</h1>
        <span id="storage-status">Not connected</span>
      </div>
      <div id="photos" class="photo-grid" aria-live="polite"></div>
    </section>
  </main>
  <dialog id="authorization" class="dialog dialog-bottom authorization-sheet">
    <button class="dialog-close" type="button" data-dialog-close aria-label="Close">×</button>
    <div class="dialog-body">
      <span class="files-mark" aria-hidden="true">F</span>
      <h2>Save photos to Files</h2>
      <p>Camera needs permission to create and read only the files stored by this app. Other apps and personal files remain private.</p>
      <ul><li>Read Camera’s photo library</li><li>Save new photos</li></ul>
      <button id="authorize-button" class="primary-button" type="button">Continue with MyCenter</button>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <canvas id="capture" hidden></canvas>
</body>
</html>
